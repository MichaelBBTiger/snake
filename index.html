<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>贪吃蛇</title>
<style>
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#1b1f2a;color:#eee;font-family:system-ui,sans-serif}
  h1{margin:0 0 8px;font-size:24px}
  #info{margin-bottom:8px;display:flex;gap:24px}
  canvas{background:#10131b;border:3px solid #3a4258;border-radius:8px}
  p{color:#99a;font-size:13px}
  button{margin-top:8px;padding:6px 16px;border:0;border-radius:6px;background:#4caf50;color:#fff;font-size:14px;cursor:pointer}
</style>
</head>
<body>
<h1>🐍 贪吃蛇</h1>
<div id="info"><span>分数：<b id="score">0</b></span><span>最高分：<b id="best">0</b></span></div>
<canvas id="c" width="400" height="400"></canvas>
<p>方向键 / WASD 控制，空格暂停或开始，手机可滑动屏幕</p>
<button id="restart">重新开始</button>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const N=20,S=cv.width/N;
let snake,dir,nextDir,food,score,best=+localStorage.getItem('snakeBest')||0,timer,running,over,speed;
document.getElementById('best').textContent=best;
function reset(){
  snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];dir=nextDir={x:1,y:0};
  score=0;speed=130;over=false;running=false;placeFood();updateScore();draw();
  clearInterval(timer);
}
function placeFood(){
  do{food={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)};}
  while(snake.some(s=>s.x===food.x&&s.y===food.y));
}
function updateScore(){
  document.getElementById('score').textContent=score;
  if(score>best){best=score;localStorage.setItem('snakeBest',best);document.getElementById('best').textContent=best;}
}
function start(){clearInterval(timer);running=true;timer=setInterval(step,speed);}
function toggle(){
  if(over){reset();start();return;}
  if(running){running=false;clearInterval(timer);draw();}else start();
}
function step(){
  dir=nextDir;
  const h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
  if(h.x<0||h.y<0||h.x>=N||h.y>=N||snake.some(s=>s.x===h.x&&s.y===h.y)){
    over=true;running=false;clearInterval(timer);draw();return;
  }
  snake.unshift(h);
  if(h.x===food.x&&h.y===food.y){
    score++;updateScore();placeFood();
    if(speed>60&&score%3===0){speed-=8;start();}
  }else snake.pop();
  draw();
}
function draw(){
  ctx.fillStyle='#10131b';ctx.fillRect(0,0,cv.width,cv.height);
  ctx.fillStyle='#ff5252';
  ctx.beginPath();ctx.arc(food.x*S+S/2,food.y*S+S/2,S/2-2,0,7);ctx.fill();
  snake.forEach((s,i)=>{
    ctx.fillStyle=i===0?'#8bc34a':'#4caf50';
    ctx.fillRect(s.x*S+1,s.y*S+1,S-2,S-2);
  });
  ctx.textAlign='center';ctx.fillStyle='#fff';
  if(over){ctx.font='bold 28px sans-serif';ctx.fillText('游戏结束',200,190);ctx.font='16px sans-serif';ctx.fillText('按空格重新开始',200,220);}
  else if(!running){ctx.font='18px sans-serif';ctx.fillText('按空格或方向键开始',200,200);}
}
function turn(x,y){
  if(x===-dir.x&&y===-dir.y)return;
  nextDir={x,y};
  if(!running&&!over)start();
}
document.addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  const m={arrowup:[0,-1],w:[0,-1],arrowdown:[0,1],s:[0,1],arrowleft:[-1,0],a:[-1,0],arrowright:[1,0],d:[1,0]};
  if(m[k]){e.preventDefault();turn(...m[k]);}
  else if(k===' '){e.preventDefault();toggle();}
});
let tx,ty;
cv.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY;e.preventDefault();},{passive:false});
cv.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)<10&&Math.abs(dy)<10){toggle();return;}
  if(Math.abs(dx)>Math.abs(dy))turn(dx>0?1:-1,0);else turn(0,dy>0?1:-1);
});
document.getElementById('restart').onclick=()=>{reset();start();};
reset();
</script>
</body>
</html>
